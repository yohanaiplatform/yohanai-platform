name: Daily Report

on:
  # Jadwal otomatis DIMATIKAN (3 Okt 2026): GitHub membatasi cron repo ini (jalan tiap 3-4 jam / terlewat).
  # Pemicu sekarang: cron-job.org -> GET /api/cron/hourly. Workflow ini tinggal untuk run manual.
  workflow_dispatch: {}

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily report email
        run: |
          HTTP_CODE=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            "https://yohanai.id/api/reports/daily" \
            -H "x-report-secret: ${{ secrets.DAILY_REPORT_SECRET }}")
          echo "HTTP Status: $HTTP_CODE"
          cat /tmp/response.json
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "::error::Daily report failed with status $HTTP_CODE"
            exit 1
          fi
