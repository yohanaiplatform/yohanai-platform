name: Daily Report

on:
  schedule:
    # 00:12 UTC = 07:12 WIB -- sengaja TIDAK tepat jam bulat (00:00), GitHub
    # Actions mendokumentasikan jadwal tepat di awal jam sebagai waktu
    # beban tertinggi/paling sering telat. Ketemu 2 Oktober 2026: 3 run
    # berturut-turut (29-30 Sep, 1 Okt) semua telat konsisten ~3-3.5 jam
    # dari jadwal "0 0 * * *", dan run tanggal 2 Okt tidak pernah jalan
    # otomatis sama sekali sampai ditrigger manual. Pola linier (bukan
    # hard fail) ini konsisten dengan warning resmi GitHub, bukan bug kode.
    - cron: "12 0 * * *"
  workflow_dispatch: {}

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily report email
        run: |
          HTTP_CODE=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            "https://yohanai.id/api/reports/daily" \
            -H "x-report-secret: ${{ secrets.DAILY_REPORT_SECRET }}")
          echo "HTTP Status: $HTTP_CODE"
          cat /tmp/response.json
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "::error::Daily report failed with status $HTTP_CODE"
            exit 1
          fi
