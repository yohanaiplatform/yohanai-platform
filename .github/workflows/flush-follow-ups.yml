name: Flush AI Follow-up Queue

on:
  # Jadwal otomatis DIMATIKAN (3 Okt 2026): GitHub membatasi cron repo ini (jalan tiap 3-4 jam / terlewat).
  # Pemicu sekarang: cron-job.org -> GET /api/cron/hourly. Workflow ini tinggal untuk run manual.
  workflow_dispatch: {}

jobs:
  flush:
    runs-on: ubuntu-latest
    steps:
      - name: Flush follow-up queue
        run: |
          HTTP_CODE=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            "https://yohanai.id/api/ai/flush-follow-ups" \
            -H "x-flush-secret: ${{ secrets.AI_FOLLOW_UP_FLUSH_SECRET }}")
          echo "HTTP Status: $HTTP_CODE"
          cat /tmp/response.json
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "::error::Flush follow-up queue failed with status $HTTP_CODE"
            exit 1
          fi
